plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.removebg'
version = '0.1.0'

android {
  namespace "expo.modules.removebg"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // ML Kit subject segmentation is unavailable below API 24.
    minSdk 24
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bundled in the APK (~4.5 MB). Works fully offline and without Play
  // services, but only segments people.
  implementation 'com.google.mlkit:segmentation-selfie:16.0.0-beta6'

  // Segments arbitrary subjects. The model is fetched on demand by Google Play
  // services and then cached, so the first call may need a one-time download.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'

  // GoogleApiAvailability, used to report whether `subject` is reachable.
  implementation 'com.google.android.gms:play-services-base:18.11.0'

  // EXIF orientation handling on API 24-27, where ImageDecoder is unavailable.
  implementation 'androidx.exifinterface:exifinterface:1.4.2'
}